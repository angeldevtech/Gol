name: Android Rebuild (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente (ej: v1.1.1)'
        required: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create secrets.properties
        run: |
          echo "API_BASE_URL=\"${{ secrets.API_BASE_URL }}\"" > secrets.properties
          echo "IMG_BASE_URL=\"${{ secrets.IMG_BASE_URL }}\"" >> secrets.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > main-keystore.jks

      - name: Configure Keystore in Gradle Properties
        run: |
          echo "" >> gradle.properties
          echo "android.injected.signing.store.file=$(pwd)/main-keystore.jks" >> gradle.properties
          echo "android.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}" >> gradle.properties
          echo "android.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "android.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p release
          find app/build/outputs/apk/release -name "*.apk" -type f -exec cp {} release/Gol.apk \;

      - name: Replace APK in existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: release/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}