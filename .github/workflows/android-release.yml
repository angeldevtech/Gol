name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create secrets.properties
        run: |
          echo "API_BASE_URL=\"${{ secrets.API_BASE_URL }}\"" > secrets.properties
          echo "IMG_BASE_URL=\"${{ secrets.IMG_BASE_URL }}\"" >> secrets.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > main-keystore.jks

      - name: Update version in build.gradle
        run: |
          # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $VERSION"
          
          # Update versionName in build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/g" app/build.gradle.kts
          
          # Calculate versionCode based on version components
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "Setting versionCode to $VERSION_CODE"
          
          # Update versionCode in build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/g" app/build.gradle.kts

      - name: Configure Keystore in Gradle Properties
        run: |
          echo "" >> gradle.properties
          echo "android.injected.signing.store.file=$(pwd)/main-keystore.jks" >> gradle.properties
          echo "android.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}" >> gradle.properties
          echo "android.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "android.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p release
          find app/build/outputs/apk/release -name "*.apk" -type f -exec cp {} release/"Gol v${VERSION}.apk" \;

      - name: Generate Changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.1.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.apk
          name: Gol v${{ github.ref_name }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            Download the APK file and install it on your Android device or Android TV.
            
            See the [README](README.md) for more information.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}